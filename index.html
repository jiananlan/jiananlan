<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetPhotos 论坛签名 & Google AdSense</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        iframe {
            width: 600px; /* 你可以根据需要调整 */
            height: 200px;
            border: none;
            margin-bottom: 20px;
        }
    </style>
    <!-- Google AdSense 代码 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2618333883518426"
        crossorigin="anonymous"></script>
</head>
<body>

    <!-- JetPhotos 论坛签名 -->
    <iframe src="https://www.jetphotos.com/jp_forum_sign.php?photogid=251600"></iframe>

    <!-- Google 广告位 -->
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-2618333883518426"
        data-ad-slot="你的广告单元 ID"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

</body>
</html>
